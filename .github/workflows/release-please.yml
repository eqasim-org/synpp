on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

name: release-please

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose tokens
        env:
          RP_TOKEN: ${{ secrets.RELEASE }}
          ACTION_TOKEN: ${{ github.token }}
        run: |
          echo "RP token length: ${#RP_TOKEN}"
          echo "Action token length: ${#ACTION_TOKEN}"

          echo "--- PAT ---"
          GH_TOKEN="$RP_TOKEN" gh api user --jq '.login'
          GH_TOKEN="$RP_TOKEN" gh api \
            repos/${{ github.repository }}/commits/29ff91b2c7aef99cdc946bf8110f195edda12376 \
            --jq '{sha: .sha, files: (.files | length)}'

          echo "--- Actions GITHUB_TOKEN ---"
          GH_TOKEN="$ACTION_TOKEN" gh api user --jq '.login'
          GH_TOKEN="$ACTION_TOKEN" gh api \
            repos/${{ github.repository }}/commits/29ff91b2c7aef99cdc946bf8110f195edda12376 \
            --jq '{sha: .sha, files: (.files | length)}'
      - uses: googleapis/release-please-action@v5
        with:
          release-type: simple
          token: ${{ secrets.RELEASE }}
      - uses: actions/checkout@v7
        if: ${{ steps.release.outputs.release_created }}
      - uses: actions/setup-python@v6
        if: ${{ steps.release.outputs.release_created }}
        with:
          python-version: "3.10"
      - name: Publish
        if: ${{ steps.release.outputs.release_created }}
        run: |
          pip install --upgrade build twine
          python -m build
          python3 -m twine upload -u  -p ${{ secrets.PYPI }} dist/*
