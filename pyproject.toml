[project]
name = "synpp"
version = "1.8.0"
description = "Synthetic population pipeline package for eqasim"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"

authors = [
    { name = "Sebastian Hörl", email = "hoerl.sebastian@gmail.com" }
]

keywords = [
    "pipeline",
    "automation",
    "synthetic population",
    "dependency management",
    "transport",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "networkx>=3.4",
    "pyyaml>=5.3.1",
    "pyzmq>=19.0.0",
]

[project.urls]
Homepage = "https://github.com/eqasim-org/synpp"
Repository = "https://github.com/eqasim-org/synpp"

[project.optional-dependencies]
example = [
    "pandas>=0.25.3",
]

[dependency-groups]
dev = [
    "pytest>=5.3.1",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"
